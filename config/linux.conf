
# 让窗口初始大小适合视频尺寸
# 强制窗口大小为屏幕的 80%（小视频也会被放大）
geometry=60%x60%
# 保持视频比例不被拉伸
keepaspect-window=yes
# 可选：限制窗口最大不超过屏幕的90%
autofit-larger=90%x90%
# 可选：让窗口在视频加载后立即显示并调整大小
force-window=immediate
#ontop=yes                              # 默认不置顶窗口，启用此项为 yes 则默认置顶
corner-rounding=0.5                   # <0~1> 控制窗口圆角大小。0=禁用，1=最大
                                      ## --keep-open=yes、--keep-open-pause=yes 参数为 [end] 条件配置组生效前置条件
input-ipc-server=/tmp/mpvsocket           # input-ipc-server=<ipc_path> 开启 Ipc 功能，Linux/MacOS: input-ipc-server=/tmp/mpvsocket
                                      # 使用 SVP manager 时此项需设置为 mpvpipe 值
osd-color="#ef14d5"                   # OSD 文本主颜色。<格式为 (AA)RRGGBB> AA 为十六进制的透明度，RRGGBB 为十六进制的颜色表示
osd-playlist-entry=both               # <默认 title|filename|both> 指定播放列表显示媒体标题或文件名或显示两者。both 同时显示标题和文件名，网络流优先显示标题
osd-playing-msg="${?demuxer-via-network==yes:${media-title}}${?demuxer-via-network==no:${filename}} ${!playlist-count==1:列表:${playlist-pos-1}/${playlist-count}}"

icc-cache-dir="~~/cache/icc_cache"   # 指定目录存储和加载从 ICC 配置文件创建的 3D LUT。这可以用来加快加载速度。请注意，这些文件包含未压缩的 LUT。它们的大小取决于--icc-3dlut-size，并且可能非常大。注意：这不会自动清除，因此旧的，未使用的缓存文件可能会无限期地停留

##⇘⇘以下为缩放算法相关参数设置（当不使用着色器配置组时生效）
scale=ewa_lanczossharp                # <bilinear/bicubic_fast/oversample/spline16/spline36/spline64/lanczos/ginseng/ewa_lanczos/ewa_lanczossharp/ewa_lanczos4sharpest/ewa_hanning/ewa_ginseng/ewa_roidolf/mitchell/catmull_rom/robidoux/robidouxsharp/bicubic/lanczos> 亮度放大算法
                                      ## ewa_lanczossharp 是 ewa_lanczos 的锐化变体，质量与性能的较好平衡；使用着色器放大时此项会被覆盖
dscale=mitchell                       # 亮度缩小算法。mitchell 在缩小场景下表现优秀，锐利度和振铃之间取得良好平衡
cscale=spline36                       # 色度升频算法。当使用 KrigBilateral 着色器时此项会被覆盖；spline36 是不使用着色器时的最佳选择
tscale=mitchell                       # 时间插值算法（仅在 interpolation 启用时生效）
dither-depth=auto                     # 抖动深度。auto 自动匹配显示器位深，确保低位深显示器上的色彩过渡平滑
correct-downscaling=yes               # 修正缩小算法的数学精度。启用后缩小操作在伽马光下进行，避免色带伪影
linear-downscaling=yes                # 缩小操作在线性光下进行。配合 SSimDownscaler 使用时需设为 no
#ao=alsa                              # --ao=<driver1,driver2,...[,]> 指定要使用的音频输出驱动程序的优先级列表，如果列表有尾随的 ','，mpv 将回退到未包含在列表中的驱动程序
                                      ## windows 推荐 wasapi；linux 推荐 alsa，需配合参数--audio-channels=auto；macos 推荐 coreaudio 或 coreaudio_exclusive
                                      ## 经测试如果有其他软件独占音频通道后再打开 MPV 画面会无比卡顿
audio-file-paths=audio:audios:audio 5.1:audios 5.1:audio 7.1:audios 7.1:音轨
sub-file-paths=sub:subs:subtitles:字幕
sub-font-size=44                              # 文本字幕字体大小
screenshot-format=png                         # <默认 jpg|(同前)jpeg|png|webp|jxl|avif>
screenshot-webp-quality=100                    # <0-100> [当 --screenshot-webp-lossless=no 时生效] 有损 WEBP 的质量，默认 75
#vf-toggle=@rtx-hdr:d3d11vpp=nvidia-true-hdr                                    # [Windows 专属，需 --gpu-api=d3d11] NVIDIA RTX VIDEO HDR 视频滤镜，用于 HDR 输出环境下将 SDR 反向映射为 HDR。Linux 下不可用
                                                                                ## 如需使用请通过下方的 [RTX-HDR] 条件配置组来正确应用它
#vf-toggle=@rtx-vsr:d3d11vpp=format=nv12:scale=2:scaling-mode=nvidia            # [Windows 专属，需 --gpu-api=d3d11] NVIDIA RTX VSR 视频滤镜，超分辨率技术。Linux 下不可用
#glsl-shaders="~~/shaders/igv/KrigBilateral.glsl;~~/shaders/igv/FSRCNNX_x2_8-0-4-1.glsl;~~/shaders/igv/SSimSuperRes.glsl;~~/shaders/igv/SSimDownscaler.glsl"
#glsl-shaders-append="~~/shaders/nnedi3/gather/nnedi3-nns32-win8x4.glsl"         # 超高质量的插值放大算法（gather 版，Vulkan 优化）。最小缩放触发倍率为 1.2，耗能适中，nns16 → nns32 → nns64 → nns128 → nns256；win8x4 → win8x6 质量更好但性能大增
#glsl-shaders-append="~~/shaders/ravu/gather/ravu-zoom-ar-r3.glsl"               # ravu 放大算法 zoom 变体（gather 版，Vulkan 优化），通用型，触发倍率＞1，放大到目标分辨率，生效时将覆盖指定的--scale=xxxxx 算法。4 倍以上的放大效果不如 mpv 内部的 ewa 类 scale 算法
#glsl-shaders-append="~~/shaders/ravu/gather/ravu-lite-ar-r3.glsl"               # ravu 放大算法 lite 变体（gather 版，Vulkan 优化），通用型，最小缩放触发倍率约为 1.2，最锐利的变体，生效时将覆盖指定的--scale=xxxxx 算法
#glsl-shaders="~~/shaders/AnimeJaNai/AnimeJaNaiV3L1_HD_x2.glsl"             # AnimeJaNaiV3 放大算法。对于瑕疵的处理效果极好，是比 Anime4K 更优秀的动画着色器，相比 Ani4k 更锐会产生涂抹感，观感类似 AniSD。性能开销较大
#glsl-shaders="~~/shaders/Ani4k/Ani4Kv2_ArtCNN_C4F32_i2.glsl"                   # Ani4k 放大算法。对于瑕疵的处理效果极好，同时尽可能保留原始画风，是比 Anime4K 更优秀的动画着色器。但性能开销极大，请量力使用
use-filedir-conf = yes                            # 在播放文件同目录中加载配置文件
include="~~/profiles.conf"                   # 追加读取指定的配置文件
input-conf="~~/input.conf"                   # 指定 input 配置文件，用于指定键位绑定