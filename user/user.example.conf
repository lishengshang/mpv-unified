# user.example.conf — user 层模板(个人配置 + 密钥占位)
#
# 本文件是 user 层的说明模板,gen 时若 user/user.conf 不存在则从此模板复制。
# user 层是四层合并的最后覆盖层(base → platform → package → user),
# 优先级最高:在这里写任何选项都会覆盖 base/平台层的同名选项。
#
# !!! 安全红线 !!!
# - 本文件只含占位符,不含任何真实密钥。真实密钥一律写进 user/user.conf
#   (已被 .gitignore 忽略,不会入库)。
# - 不要在任何被 git 跟踪的文件里写真实 API key / token。
# - CI 会扫描仓库,含真实密钥的提交会被拦截。
#
# 常用做法:把个人偏好放在这里,把密钥填在对应脚本的 script-opts 里。

# ============================================================
# 1. 个人偏好示例(取消注释并按需修改)
# ============================================================

# 音量 / 字幕默认值
#volume=100
#sub-font-size=44

# 你的显示器 / 显卡相关的个人调整
#target-peak=auto
#icc-profile-auto=no

# 播放器行为
#idle=yes
#save-position-on-quit=yes

# 网络代理(示例;真实代理按你的环境填写)
#ytdl-raw-options-append=proxy=http://127.0.0.1:7890

# ============================================================
# 2. 脚本 API 密钥占位(真实值填到 user/ 或 script-opts/ 的实体文件)
# ============================================================
# 注意:密钥实体文件必须保持 .example 之外独立存在且被 gitignore,
# 详见 docs/platform-assets.md 的密钥扫描约定。

## 字幕下载脚本(sub_assrt)需要 assrt token:
##   编辑 user/script-opts/sub_assrt.conf 或直接在 script-opts/ 下放置:
##   token=<你的 assrt token,占位:YOUR_ASSRT_TOKEN_HERE>

## AI 字幕生成脚本(sub_fastwhisper)需要 whisper 服务地址/密钥:
##   占位:YOUR_WHISPER_ENDPOINT / YOUR_WHISPER_TOKEN

## trakt 同步(trakt_scrobble)需要 client_id:
##   占位:YOUR_TRAKT_CLIENT_ID

## 弹幕脚本(uosc_danmaku)可能需要登录 cookie:
##   占位:YOUR_DANMAKU_COOKIE

# ============================================================
# 3. 说明
# ============================================================
# - 选项语法与 mpv.conf 相同:key=value,支持注释行、profile 块。
# - 条件指令(#@if platform==...)在 user 层同样生效。
# - 此文件被复制为 user/user.conf 后即可编辑;升级时 user/ 层原样保留。
